<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" role="img" aria-label="PrismaXI: chữ XI trong lục giác, quả bóng bay theo quỹ đạo xoáy">
  <defs>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6fadf6"/>
      <stop offset=".55" stop-color="#46e2b5"/>
      <stop offset="1" stop-color="#f4b63f"/>
    </linearGradient>
  </defs>

  <!-- The distant half of the orbit sits behind the original B badge. -->
  <ellipse cx="88" cy="90" rx="79" ry="53" transform="rotate(-23 88 90)"
           fill="none" stroke="url(#orbit)" stroke-width="3" opacity=".48"/>
  <path d="M24 74 C49 32 106 18 144 37" fill="none" stroke="#46e2b5"
        stroke-width="3.5" stroke-linecap="round" opacity=".52"/>

  <!-- Original concept B geometry, scaled without changing the XI strokes. -->
  <g transform="translate(16 18) scale(1.2)">
    <polygon points="60,6 106.8,33 106.8,87 60,114 13.2,87 13.2,33"
             fill="#0f2a33" stroke="#46e2b5" stroke-width="5" stroke-linejoin="round"/>
    <g transform="translate(3.5 0)" fill="none" stroke-linecap="round" stroke-width="9">
      <path d="M28 40L58 82" stroke="#46e2b5"/>
      <path d="M58 40C50 54 40 66 28 82" stroke="#6fadf6"/>
      <path d="M80 52V82" stroke="#f4b63f"/>
    </g>
    <circle cx="83.5" cy="38" r="6.5" fill="#f4b63f"/>
  </g>

  <!-- Near half of the orbit slips across the lower rim, clear of XI. -->
  <path d="M15 109 C22 145 69 166 113 153 C131 148 145 137 155 123"
        fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round"/>
  <path d="M22 119 C42 151 82 160 110 150" fill="none"
        stroke="#d6fff2" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>

  <!-- Small football on the upper-right section of the orbit. -->
  <path d="M127 52 C137 43 143 42 148 44" fill="none"
        stroke="#f4b63f" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>
  <circle cx="158" cy="43" r="14" fill="#0a171d" stroke="#46e2b5" stroke-width="2.5"/>
  <circle cx="158" cy="43" r="10.7" fill="#f3f8f5"/>
  <path d="M158 37.1 163.7 41.3 161.5 48 154.5 48 152.3 41.3Z" fill="#0f2a33"/>
  <g fill="none" stroke="#0f2a33" stroke-width="1.55" stroke-linecap="round">
    <path d="M158 37.1v-4.7M163.7 41.3l3.8-1.3M161.5 48l2.4 3.2M154.5 48l-2.4 3.2M152.3 41.3l-3.8-1.3"/>
  </g>
  <path d="M174 34l3-2m-2 8 3-1" stroke="#6fadf6" stroke-width="2" stroke-linecap="round"/>
</svg>
