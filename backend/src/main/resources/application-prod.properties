logging.level.root=INFO
logging.level.com.premierhub=INFO
debug=false
spring.datasource.url=${PREMIERHUB_JDBC_URL}
spring.datasource.username=${PREMIERHUB_DB_USER}
spring.datasource.password=${PREMIERHUB_DB_PASSWORD}
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Production schema changes require a reviewed migration and backup, not app startup.
spring.sql.init.mode=never
server.servlet.session.cookie.secure=true
