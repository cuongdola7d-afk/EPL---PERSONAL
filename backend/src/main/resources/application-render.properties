# Activate after prod: SPRING_PROFILES_ACTIVE=prod,render.
# The JDBC URL must contain only host/port/database; entrypoint rejects query overrides.
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${PREMIERHUB_DB_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.datasource.hikari.data-source-properties.connectTimeout=10000

# Keep the connection pool small for one Render Free instance / Aiven Free.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=0
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2

# No automatic DDL, CSV bootstrap or console import commands on this host.
spring.sql.init.mode=never
spring.session.jdbc.initialize-schema=never
premierhub.minigame.local-data.enabled=false
