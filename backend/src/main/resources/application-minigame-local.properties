# Isolated local-only database: inherited production JDBC variables cannot choose the datasource.
spring.datasource.url=jdbc:h2:file:./target/minigame-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:auth-schema.sql,classpath:fantasy-gameweek-schema.sql,classpath:fantasy-entry-schema.sql,classpath:fantasy-result-schema.sql,classpath:player-guess-schema.sql
premierhub.minigame.enabled=true
server.servlet.session.cookie.secure=false
premierhub.auth-proxy.enabled=false
PREMIERHUB_GOOGLE_FRONTEND_ORIGIN=http://localhost:5173
PREMIERHUB_GOOGLE_CALLBACK_URI=http://localhost:8080/api/auth/google/callback
