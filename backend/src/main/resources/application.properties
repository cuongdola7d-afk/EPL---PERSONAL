spring.application.name=premierhub-backend
server.port=${PORT:8080}
spring.datasource.url=${PREMIERHUB_JDBC_URL:jdbc:h2:file:./premierhub-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${PREMIERHUB_DB_USER:sa}
spring.datasource.password=${PREMIERHUB_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:auth-schema.sql,classpath:fantasy-gameweek-schema.sql,classpath:fantasy-entry-schema.sql
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Keep the socket peer intact; only the auth resolver may trust explicitly configured proxies.
server.forward-headers-strategy=none
premierhub.auth-rate-limit.login-ip.attempts=${PREMIERHUB_AUTH_LOGIN_IP_ATTEMPTS:20}
premierhub.auth-rate-limit.login-ip.window=${PREMIERHUB_AUTH_LOGIN_IP_WINDOW:5m}
premierhub.auth-rate-limit.login-email.attempts=${PREMIERHUB_AUTH_LOGIN_EMAIL_ATTEMPTS:5}
premierhub.auth-rate-limit.login-email.window=${PREMIERHUB_AUTH_LOGIN_EMAIL_WINDOW:5m}
premierhub.auth-rate-limit.registration-ip.attempts=${PREMIERHUB_AUTH_REGISTER_IP_ATTEMPTS:5}
premierhub.auth-rate-limit.registration-ip.window=${PREMIERHUB_AUTH_REGISTER_IP_WINDOW:15m}
premierhub.auth-rate-limit.google-ip.attempts=${PREMIERHUB_AUTH_GOOGLE_IP_ATTEMPTS:10}
premierhub.auth-rate-limit.google-ip.window=${PREMIERHUB_AUTH_GOOGLE_IP_WINDOW:5m}
premierhub.auth-rate-limit.max-entries=${PREMIERHUB_AUTH_LIMIT_MAX_ENTRIES:10000}
premierhub.auth-rate-limit.cleanup-interval=${PREMIERHUB_AUTH_LIMIT_CLEANUP_INTERVAL:60s}
premierhub.auth-rate-limit.trusted-proxies=${PREMIERHUB_AUTH_TRUSTED_PROXIES:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
