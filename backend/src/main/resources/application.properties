spring.application.name=premierhub-backend
server.port=${PORT:8080}
spring.datasource.url=${PREMIERHUB_JDBC_URL:jdbc:h2:file:./premierhub-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${PREMIERHUB_DB_USER:sa}
spring.datasource.password=${PREMIERHUB_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:auth-schema.sql,classpath:fantasy-gameweek-schema.sql,classpath:fantasy-entry-schema.sql,classpath:fantasy-result-schema.sql
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Keep the socket peer intact; only the auth resolver may trust explicitly configured proxies.
server.forward-headers-strategy=none
premierhub.auth-rate-limit.login-ip.attempts=${PREMIERHUB_AUTH_LOGIN_IP_ATTEMPTS:20}
premierhub.auth-rate-limit.login-ip.window=${PREMIERHUB_AUTH_LOGIN_IP_WINDOW:5m}
premierhub.auth-rate-limit.login-email.attempts=${PREMIERHUB_AUTH_LOGIN_EMAIL_ATTEMPTS:5}
premierhub.auth-rate-limit.login-email.window=${PREMIERHUB_AUTH_LOGIN_EMAIL_WINDOW:5m}
premierhub.auth-rate-limit.registration-ip.attempts=${PREMIERHUB_AUTH_REGISTER_IP_ATTEMPTS:5}
premierhub.auth-rate-limit.registration-ip.window=${PREMIERHUB_AUTH_REGISTER_IP_WINDOW:15m}
premierhub.auth-rate-limit.google-ip.attempts=${PREMIERHUB_AUTH_GOOGLE_IP_ATTEMPTS:10}
premierhub.auth-rate-limit.google-ip.window=${PREMIERHUB_AUTH_GOOGLE_IP_WINDOW:5m}
premierhub.auth-rate-limit.max-entries=${PREMIERHUB_AUTH_LIMIT_MAX_ENTRIES:10000}
premierhub.auth-rate-limit.cleanup-interval=${PREMIERHUB_AUTH_LIMIT_CLEANUP_INTERVAL:60s}
premierhub.auth-rate-limit.trusted-proxies=${PREMIERHUB_AUTH_TRUSTED_PROXIES:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
# Optional, private read-latency diagnostics. Never enable SQL/parameter debug logging.
premierhub.diagnostics.read-latency.enabled=${PREMIERHUB_READ_LATENCY_ENABLED:false}
premierhub.diagnostics.read-latency.probe-enabled=${PREMIERHUB_READ_LATENCY_PROBE_ENABLED:false}

# Live SSE infrastructure and optional test stream channel.
premierhub.live.max-connections=${PREMIERHUB_LIVE_MAX_CONNECTIONS:200}
premierhub.live.emitter-timeout-ms=${PREMIERHUB_LIVE_EMITTER_TIMEOUT_MS:1800000}
premierhub.live.heartbeat-interval-ms=${PREMIERHUB_LIVE_HEARTBEAT_INTERVAL_MS:25000}
premierhub.live.test-stream.enabled=${PREMIERHUB_LIVE_TEST_STREAM_ENABLED:false}
premierhub.live.test-stream.timeout-ms=${PREMIERHUB_LIVE_TEST_STREAM_TIMEOUT_MS:3600000}
premierhub.live.test-stream.tick-interval-ms=${PREMIERHUB_LIVE_TEST_STREAM_TICK_INTERVAL_MS:10000}
premierhub.live.scores.enabled=${PREMIERHUB_LIVE_SCORES_ENABLED:true}
premierhub.live.poll-interval-ms=${PREMIERHUB_LIVE_POLL_INTERVAL_MS:30000}
premierhub.live.replay-dir=${PREMIERHUB_LIVE_REPLAY_DIR:}
premierhub.live.replay-interval-ms=${PREMIERHUB_LIVE_REPLAY_INTERVAL_MS:3000}

# Scheduled football-data.org sync for season 2026 fixtures, standings, and clubs.
premierhub.football-data.auto-sync.enabled=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_ENABLED:false}
premierhub.football-data.auto-sync.check-interval-ms=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_CHECK_INTERVAL_MS:60000}
premierhub.football-data.auto-sync.initial-delay-ms=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_INITIAL_DELAY_MS:15000}
premierhub.football-data.auto-sync.matchday-interval-minutes=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_MATCHDAY_INTERVAL_MINUTES:10}
premierhub.football-data.auto-sync.normal-interval-minutes=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_NORMAL_INTERVAL_MINUTES:360}
premierhub.football-data.auto-sync.window-before-minutes=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_WINDOW_BEFORE_MINUTES:15}
premierhub.football-data.auto-sync.window-after-minutes=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_WINDOW_AFTER_MINUTES:240}
premierhub.football-data.auto-sync.backoff-initial-minutes=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_BACKOFF_INITIAL_MINUTES:10}
premierhub.football-data.auto-sync.backoff-max-minutes=${PREMIERHUB_FOOTBALL_DATA_AUTO_SYNC_BACKOFF_MAX_MINUTES:60}
