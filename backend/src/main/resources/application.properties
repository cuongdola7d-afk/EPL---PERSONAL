spring.application.name=premierhub-backend
server.port=${PORT:8080}
spring.datasource.url=${PREMIERHUB_JDBC_URL:jdbc:h2:file:./premierhub-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${PREMIERHUB_DB_USER:sa}
spring.datasource.password=${PREMIERHUB_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:auth-schema.sql
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
