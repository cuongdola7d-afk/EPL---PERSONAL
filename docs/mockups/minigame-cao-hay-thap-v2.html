<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrismaXI · Minigame (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9f2ef;--bg2:#d6e8e2;--card:#ffffff;--card2:#f3f8f6;--line:rgba(16,44,54,.09);
  --text:#0f2a33;--mute:#5d7a83;--acc:#14b988;--acc2:#0a8f68;--onacc:#ffffff;
  --shadow:0 12px 32px rgba(16,44,54,.09);--chip-bg:rgba(16,44,54,.06);--hover:rgba(16,44,54,.05);--bar:rgba(233,242,239,.86);
  --accword:#0a8f68;--ink:#0f2a33;--sheet:#ffffff;--warn:#d9822b;--bad:#e05252;--good:#1fb37f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a171d;--bg2:#10303a;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.035);--line:rgba(255,255,255,.09);
    --text:#eaf5f2;--mute:#8aa6ae;--acc:#46e2b5;--acc2:#23bb90;--onacc:#05241c;
    --shadow:0 16px 36px rgba(0,0,0,.38);--chip-bg:rgba(255,255,255,.08);--hover:rgba(255,255,255,.07);--bar:rgba(10,23,29,.86);
    --accword:#46e2b5;--ink:#0c1f27;--sheet:#12272f;--warn:#f4b63f;--bad:#ff7d7d;--good:#46e2b5;
  }
}
:root[data-theme="dark"]{
  --bg:#0a171d;--bg2:#10303a;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.035);--line:rgba(255,255,255,.09);
  --text:#eaf5f2;--mute:#8aa6ae;--acc:#46e2b5;--acc2:#23bb90;--onacc:#05241c;
  --shadow:0 16px 36px rgba(0,0,0,.38);--chip-bg:rgba(255,255,255,.08);--hover:rgba(255,255,255,.07);--bar:rgba(10,23,29,.86);
  --accword:#46e2b5;--ink:#0c1f27;--sheet:#12272f;--warn:#f4b63f;--bad:#ff7d7d;--good:#46e2b5;
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(900px 420px at 15% -8%,var(--bg2),transparent 70%),var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 56px}
.nav{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nin{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.03em;flex:none}
.brand b{color:var(--accword);font-weight:800}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;margin:0 4px}
.links::-webkit-scrollbar{display:none}
.links a{flex:none;padding:8px 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mute);border:1px solid transparent}
.links a:hover{color:var(--text);background:var(--hover)}
.links a[aria-current="page"]{color:var(--text);border-color:var(--acc);background:var(--chip-bg)}
.nr{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.me{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.me .a{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-weight:800;font-size:12px}
.login{padding:8px 16px;border-radius:99px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:14px}
.dev{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;border:1px dashed var(--line);border-radius:18px;font-size:13px;color:var(--mute)}
.dev select{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:500;color:var(--mute)}
.back:hover{color:var(--text)}

/* hub */
.hero{position:relative;overflow:hidden;padding:26px 24px;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:14px}
.hero svg.deco{position:absolute;right:-30px;top:-40px;width:240px;height:240px;color:var(--acc);opacity:.16;pointer-events:none}
.hero h1{margin:0;font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.035em}
.hero p{margin:6px 0 0;color:var(--mute);max-width:520px}
.daily{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border-radius:22px;background:linear-gradient(135deg,rgba(70,226,181,.16),rgba(111,173,246,.12));border:1px solid var(--line);margin-bottom:18px}
.daily .ic{width:46px;height:46px;border-radius:16px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;flex:none}
.daily .tx{flex:1 1 220px;min-width:0}
.daily .tx b{display:block;font-size:16px}
.daily .tx span{color:var(--mute);font-size:14px}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:-.01em;padding:6px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sec-t{margin:6px 2px 12px;font-size:20px;font-weight:700}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gc{display:flex;flex-direction:column;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,border-color .2s}
.gc.on:hover{transform:translateY(-4px);border-color:var(--acc)}
.art{position:relative;aspect-ratio:16/10;background:#0f2a33;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.badge{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:99px;font-weight:700;font-size:12px;background:var(--acc);color:var(--onacc)}
.badge.soon{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px)}
.gb{display:flex;flex-direction:column;gap:8px;padding:18px 20px 20px;flex:1}
.gb h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.gb p{margin:0;color:var(--mute);font-size:15px;line-height:1.6;flex:1}
.play{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px;border-radius:99px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(20,185,136,.26)}
.play:disabled{background:var(--chip-bg);color:var(--mute);box-shadow:none}
.gc:not(.on){opacity:.82}

/* sheet */
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(5,15,20,.58);backdrop-filter:blur(6px)}
.ov.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:20px;box-shadow:0 -20px 50px rgba(0,0,0,.3);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-h h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh-h span{color:var(--mute);font-size:14px}
.md{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;padding:16px;border-radius:22px;background:var(--card2);border:1px solid var(--line);margin-bottom:10px;transition:border-color .2s,transform .2s}
.md:hover{border-color:var(--acc);transform:translateY(-2px)}
.md .top{display:flex;align-items:center;gap:14px}
.md .mi{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none}
.md .mi.d{background:var(--acc);color:var(--onacc)}.md .mi.p{background:#6fadf6;color:#08234d}
.md b{font-size:18px;display:block;line-height:1.2}
.md .ds{color:var(--mute);font-size:14px;line-height:1.55}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--chip-bg);color:var(--mute)}
.tg.t{background:rgba(70,226,181,.16);color:var(--accword)}
.tg.w{background:rgba(244,182,63,.18);color:var(--warn)}
.md .go{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accword);font-size:15px}

/* game */
.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gh .ti{flex:1;min-width:0}
.gh h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.mchip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;font-weight:600;font-size:13px;background:var(--chip-bg)}
.mchip.d{background:rgba(70,226,181,.16);color:var(--accword)}
.mchip .clock{font-size:13px;padding:0;border:0;background:none;font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line);margin-bottom:14px;max-width:340px}
.seg button{flex:1;padding:8px 16px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mute);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.gl{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.pn{padding:18px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 18px;border-radius:22px;background:var(--card2);border:1px solid var(--line);margin-bottom:14px}
.sc .v{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.sc .l{font-size:13px;color:var(--mute);margin-top:4px}
.sc.low .v{color:var(--warn)}.sc.zero .v{color:var(--bad)}
.pips{display:flex;gap:8px;justify-content:center}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800}
.pip.live{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.pip.used{background:rgba(224,82,82,.18);border-color:var(--bad);color:var(--bad)}
.mid{text-align:center}
.mid .l{font-size:13px;color:var(--mute);margin-top:6px}
.hc{text-align:right}
.hc .v{font-size:24px;font-weight:800;line-height:1}
.hc .l{font-size:13px;color:var(--mute);margin-top:4px}
.hg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ht{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--line);min-height:76px;transition:border-color .3s,background .3s}
.ht .hi{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--chip-bg);color:var(--mute);flex:none}
.ht .k{font-size:12px;font-weight:600;color:var(--mute)}
.ht .v{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.ht.open{background:var(--card)}
.ht.open .hi{background:rgba(70,226,181,.16);color:var(--accword)}
.ht.lock .v{color:var(--mute);letter-spacing:.2em;font-weight:700}
.ht.nx{border-color:var(--acc);border-style:dashed}
.ht.new{animation:pulse 1.4s ease-out 1;border-color:var(--acc)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,226,181,.6)}100%{box-shadow:0 0 0 14px rgba(70,226,181,0)}}
.ob{display:inline-grid;place-items:center;min-width:44px;height:30px;padding:0 10px;border-radius:11px;font-weight:800;font-size:17px;letter-spacing:0}
.t-1{background:linear-gradient(135deg,#ffe49a,#f4b63f);color:#4a3000}
.t-2{background:linear-gradient(135deg,#9af2cf,#3fd8a4);color:#04402e}
.t-3{background:linear-gradient(135deg,#b4d9ff,#6fadf6);color:#0b2c56}
.t-4{background:linear-gradient(135deg,#e3e9ec,#c3ced3);color:#33454b}
.hb{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;margin-top:12px;padding:12px 18px;border-radius:99px;border:1.5px solid var(--acc);color:var(--accword);font-weight:700;font-size:16px;transition:background .2s,color .2s}
.hb small{font-weight:500;font-size:12.5px;color:var(--mute)}
.hb:hover:not(:disabled){background:var(--acc);color:var(--onacc)}
.hb:hover:not(:disabled) small{color:var(--onacc)}
.hb:disabled{border-color:var(--line);color:var(--mute);background:var(--chip-bg)}
.pn h2{margin:0 0 12px;font-size:18px;font-weight:700}
.sb{position:relative}
.sb svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.sb input{width:100%;padding:14px 16px 14px 46px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font-size:16px}
.sb input::placeholder{color:var(--mute)}
.sug{margin-top:8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.sug button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;font-weight:600;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button.hi{background:var(--hover)}
.sug .tg{flex:none}
.sug .none{padding:16px;color:var(--mute);font-size:14px;text-align:center}
.selc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 14px;border-radius:18px;background:rgba(70,226,181,.12);border:1px solid var(--acc)}
.selc b{font-size:16px}
.err{margin-top:10px;padding:10px 14px;border-radius:16px;background:rgba(224,82,82,.14);color:var(--bad);font-weight:600;font-size:14px}
.confirm{width:100%;margin-top:12px;padding:13px 20px;border-radius:99px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(20,185,136,.26)}
.confirm:disabled{background:var(--chip-bg);color:var(--mute);box-shadow:none}
.hist{margin-top:16px}
.hist .t{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:8px}
.gr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.gr .x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(224,82,82,.16);color:var(--bad)}
.gr.ok .x{background:rgba(70,226,181,.18);color:var(--good)}
.gr .n{font-weight:600}
.gr .s{font-size:12.5px;color:var(--mute)}
.gr .pt{font-weight:800;color:var(--bad)}
.gr.ok .pt{color:var(--good)}
.empt{padding:14px;border-radius:16px;border:1px dashed var(--line);color:var(--mute);font-size:14px;text-align:center}
.res{text-align:center;padding:8px 4px 4px}
.res .big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.res.win .big{color:var(--good)}.res.lose .big{color:var(--bad)}
.res h2{margin:6px 0 4px;font-size:24px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border-radius:20px;background:var(--card2);border:1px solid var(--line);margin:14px 0}
.av{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:0 8px 16px rgba(0,0,0,.25)}
.ans b{font-size:20px;letter-spacing:-.02em;display:block;line-height:1.2}
.ans span{color:var(--mute);font-size:14px}
.ra{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{padding:12px 22px;border-radius:99px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-weight:700;box-shadow:0 10px 24px rgba(20,185,136,.26)}
.btn2{padding:12px 22px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font-weight:600;color:var(--text)}
.nxt{margin-top:14px;color:var(--mute);font-size:14px}
.nxt .clock{font-size:15px;padding:2px 10px;margin-left:4px}
.rk{display:grid;grid-template-columns:44px 42px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px}
.rk.me{background:rgba(70,226,181,.14);box-shadow:inset 0 0 0 1px var(--acc)}
.rk .n{font-weight:800;color:var(--mute);text-align:center;font-size:16px}
.rk:nth-child(1) .n{color:#f4b63f}.rk:nth-child(2) .n{color:#b9c4c9}.rk:nth-child(3) .n{color:#d08a52}
.rk .av{width:42px;height:42px;font-size:14px;box-shadow:none}
.rk .nm{font-weight:600}
.rk .pt{font-weight:800;font-size:19px;text-align:right}
.eq{font-size:11px;font-weight:600;color:var(--mute);margin-left:6px}
.note{font-size:12.5px;color:var(--mute);margin-top:12px}
.rk.hd{padding-top:0;padding-bottom:6px;font-size:12px;font-weight:600;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fxflash{position:absolute;inset:0;opacity:0}
.fxflash.win{background:radial-gradient(circle at 50% 45%,rgba(70,226,181,.4),transparent 62%);animation:flash 1.2s ease-out forwards}
.fxflash.bad{background:radial-gradient(circle at 50% 50%,transparent 36%,rgba(224,82,82,.55) 100%);animation:flash 1s ease-out forwards}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.fxcard{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 38px;border-radius:30px;background:var(--sheet);border:2px solid var(--acc);box-shadow:0 24px 60px rgba(0,0,0,.4);text-align:center;max-width:88vw;animation:pop 2s cubic-bezier(.2,.9,.3,1.2) forwards}
.fxcard.bad{border-color:var(--bad)}
.fxcard .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--onacc);margin-bottom:4px}
.fxcard.bad .ic{background:var(--bad);color:#fff}
.fxcard b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.fxcard .s{font-size:15px;color:var(--mute)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}20%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}
.cf{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;opacity:0;animation:fall var(--d) cubic-bezier(.25,.6,.4,1) var(--dl) forwards}
@keyframes fall{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:1;transform:translate3d(var(--x),112vh,0) rotate(var(--r))}}
.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}

let S={auth:true,dly:'new',dlyH:'new',st:'data',gtab:'play',mode:null,game:null};

function mk(mode,preset,ans){
  const g={mode,ans,opened:0,guesses:[],score:100,status:'play',last:-1,final:null};
  if(preset==='progress'){g.opened=2;g.score=70;g.guesses=[{id:SALAH,ok:false}];g.last=3}
  if(preset==='done'){g.opened=2;g.score=70;g.guesses=[{id:SALAH,ok:false},{id:ans,ok:true}];g.status='won';g.final=70}
  return g;
}
function dailyGame(){if(!G.daily||G.dlyKey!==S.dly){G.daily=mk('daily',S.dly,DAILY_ANS);G.dlyKey=S.dly}return G.daily}
function practiceGame(fresh){if(!G.practice||fresh){let id;do{id=Math.floor(Math.random()*POOL.length)}while(G.practice&&id===G.practice.ans);G.practice=mk('practice','new',id)}return G.practice}
function openHint(g){if(g.status!=='play'||g.opened>=6)return false;g.score=Math.max(0,g.score-10);g.opened++;g.last=g.opened+1;return true}
function doGuess(g,id){
  if(g.status!=='play')return {err:'Ván chơi đã kết thúc.'};
  if(id==null||!POOL[id])return {err:'Hãy chọn một cầu thủ trong danh sách gợi ý.'};
  if(g.guesses.some(x=>x.id===id))return {err:'Bạn đã đoán cầu thủ này rồi, hãy chọn người khác. Lượt đoán và điểm không bị trừ.'};
  if(id===g.ans){g.guesses.push({id,ok:true});g.status='won';g.final=g.score;return {ok:true}}
  g.guesses.push({id,ok:false});g.score=Math.max(0,g.score-20);
  let auto=null;if(g.opened<6){g.opened++;g.last=g.opened+1;auto=HINTS[g.opened+1].l}
  if(g.guesses.filter(x=>!x.ok).length>=3){g.status='lost';g.final=0}
  return {wrong:true,auto};
}
const wrongs=g=>g.guesses.filter(x=>!x.ok).length;
const shown=(g,i)=>i<2||i-2<g.opened;

  return '<div class="hist"><div class="t">Các lượt đoán</div>'+g.guesses.map((x,i)=>'<div class="gr '+(x.ok?'ok':'')+'"><span class="x">'+(x.ok?IC.check:IC.x)+'</span><div><div class="n">'+esc(POOL[x.id].n)+'</div><div class="s">'+(x.ok?'Chính xác':'Sai · mất 1 lượt')+'</div></div><span class="pt">'+(x.ok?'+'+g.final:'−20')+'</span></div>').join('')+'</div>';
}
function resultCard(g){
  const p=POOL[g.ans],win=g.status==='won';
  const nextAct=g.mode==='daily'?'<button class="btn" data-act="rank">Xem bảng xếp hạng</button><button class="btn2" data-act="practice">Luyện tập thêm</button>':'<button class="btn" data-act="again">Chơi ván mới</button><button class="btn2" data-act="rank">Bảng xếp hạng</button>';
  return '<div class="res '+(win?'win':'lose')+'"><div class="big">'+(win?'+'+g.final:'0')+'</div><h2>'+(win?'Chính xác!':'Rất tiếc, bạn đã hết lượt')+'</h2><div style="color:var(--mute)">'+(win?(g.final===0?'Bạn đoán đúng nhưng đã hết điểm, vẫn tính là thắng.':'Bạn nhận '+g.final+' điểm cho ván này.'):'Đáp án đúng là:')+'</div>'+
   '<div class="ans"><span class="av" style="background:'+(KIT[p.c]||'#4a545b')+'">'+ini(p.n)+'</span><div><b>'+esc(p.n)+'</b><span>'+p.c+' · '+POSN[p.p]+' · #'+p.num+'</span></div></div><div class="ra">'+nextAct+'</div>'+
   (g.mode==='daily'?'<div class="nxt">Câu hỏi mới sau '+CK()+'</div>':'')+'</div>';
}
function lbView(game){
  const list=(game==='higher'?LB.higher:LB.all).map(x=>({n:x[0],pt:x[1]}));
  let rank=0,prev=null;
  const rows=list.map((x,i)=>{if(x.pt!==prev){rank=i+1;prev=x.pt}return {n:x.n,pt:x.pt,rank:rank,tie:list.filter(y=>y.pt===x.pt).length>1}});
  const cols=['#c8102e','#1f4fa3','#7b1d4a','#e0413a','#5ba3d9','#4a545b','#7a263a','#da291c'];
  return '<div class="pn"><h2>Bảng xếp hạng</h2><div class="rk hd"><span style="text-align:center">Hạng</span><span></span><span>Người chơi</span><span style="text-align:right">Tổng điểm</span></div><div class="rkl">'+rows.map(r=>{const me=S.auth&&r.n==='Đức Thịnh';
    return '<div class="rk '+(me?'me':'')+'"><span class="n">'+r.rank+'</span><span class="av" style="background:'+cols[(r.n.length+r.pt)%8]+'">'+ini(me?'Khoa Hải':r.n)+'</span><span class="nm">'+(me?'Bạn (Khoa)':esc(r.n))+(r.tie?'<span class="eq">đồng hạng</span>':'')+'</span><span class="pt">'+r.pt+'</span></div>'}).join('')+'</div></div>';
}
function gameBody(g,mode){

/* ===== Cao hay thấp: chạy hoàn toàn trên trình duyệt, không bảng xếp hạng ===== */
const HLS={
 ovr:{k:'OVR',tag:'OVR',f:p=>p.o,u:''},
 g:{k:'Bàn thắng',tag:'Bàn thắng mùa này',f:p=>p.g,u:' bàn'},
 a:{k:'Kiến tạo',tag:'Kiến tạo mùa này',f:p=>p.a,u:' kiến tạo'}
};
const HLK=['ovr','g','a'];
const HL_KEY='prismaxi-higher-best';
let HL_MEM=6; // kỷ lục mẫu khi trình duyệt chặn localStorage
function hlBest(){try{const v=localStorage.getItem(HL_KEY);return v==null?HL_MEM:+v}catch(e){return HL_MEM}}
function hlSaveBest(n){if(n<=hlBest())return false;HL_MEM=n;try{localStorage.setItem(HL_KEY,String(n))}catch(e){}return true}
let HLT=null,HLT2=null,HLC=null;
function hlClear(){clearTimeout(HLT);clearTimeout(HLT2);clearInterval(HLC);HLT=null;HLT2=null;HLC=null}
function hlRestore(){const g=G.hl.practice;if(g&&g.status==='reveal')hlAdvance(g)}
/* Chọn chỉ số ngẫu nhiên và người bên phải: giá trị phải khác người bên trái và không thiếu dữ liệu. */
function pickRound(leftId){
  const L=POOL[leftId];
  for(let t=0;t<300;t++){
    const st=HLK[Math.floor(Math.random()*HLK.length)],id=Math.floor(Math.random()*POOL.length);
    if(id===leftId)continue;
    const lv=HLS[st].f(L),rv=HLS[st].f(POOL[id]);
    if(lv==null||rv==null||lv===rv)continue;
    return {st:st,r:id};
  }
  return null;
}
function mkHL(){
  const a=Math.floor(Math.random()*POOL.length),rd=pickRound(a);
  return {seq:[a,rd.r],stats:[rd.st],i:0,score:0,status:'play',hist:[],pick:null,res:null,anim:false,newBest:false,startBest:hlBest()};
}
function hlGame(fresh){if(!G.hl.practice||fresh)G.hl.practice=mkHL();return G.hl.practice}
function hlSides(g){return {l:POOL[g.seq[g.i]],r:POOL[g.seq[g.i+1]],st:g.stats[g.i]}}
function hlApply(g,dir){
  if(g.status!=='play')return null;
  const sd=hlSides(g),s=HLS[sd.st],L=s.f(sd.l),R=s.f(sd.r);
  const ok=dir==='up'?R>L:R<L;
  g.hist.push({l:sd.l.id,r:sd.r.id,st:sd.st,L:L,R:R,ok:ok});g.pick=dir;g.res={ok:ok,L:L,R:R,st:sd.st};
  if(ok){g.score++;if(hlSaveBest(g.score))g.newBest=true;g.status='reveal'}else g.status='over';
  return g.res;
}
function hlAdvance(g){
  if(g.status!=='reveal')return;
  g.i++;const rd=pickRound(g.seq[g.i]);g.seq.push(rd.r);g.stats.push(rd.st);
  g.pick=null;g.res=null;g.status='play';g.anim=true;
}
const tierCls=o=>o>=90?'prism':o>=85?'rare':o>=78?'gold':o>=70?'silver':'bronze';
function fcard(p,mode,st){
  const hid=mode==='hidden',hideOvr=hid&&st==='ovr';
  const info=[['Quốc tịch',p.nat],['CLB',p.c],['Tuổi',age(p.dob)+' tuổi'],['Chiều cao',p.h+' cm'],['Chân thuận',p.foot],['Số áo',p.num]];
  const s=HLS[st];
  const chip=st==='ovr'?'':'<div class="fc-stat"><span class="k">'+s.k+'</span><span class="v'+(hid?' q':'')+'">'+(hid?'?':s.f(p))+'</span></div>';
  const lab='Thẻ '+esc(p.n)+(hid?', '+s.k+' đang ẩn':', '+s.k+' '+s.f(p));
  return '<div class="fc '+(hid?'mystery':tierCls(p.o))+(mode==='reveal'?' rv':'')+'" aria-label="'+lab+'"><div class="fc-hd"><div class="fc-s"><span class="fc-lbl">OVR</span><div class="fc-ovr'+(hideOvr?' q':'')+'">'+(hideOvr?'?':p.o)+'</div><div class="fc-pos">'+p.p+'</div></div><div class="fc-av" style="background:'+(KIT[p.c]||'#4a545b')+'">'+ini(p.n)+'</div></div>'+
   '<div class="fc-bd"><div class="fc-name">'+esc(p.n)+'</div><div class="fc-info">'+info.map(x=>'<div><div class="k">'+x[0]+'</div><div class="v">'+esc(x[1])+'</div></div>').join('')+'</div>'+(chip?'<div style="margin-top:10px">'+chip+'</div>':'')+'</div></div>';
}
function hlStat(g){
  const best=Math.max(hlBest(),g.score);
  return '<div class="hl-stat"><div><div class="v">'+g.score+'</div><div class="l">Điểm Số</div></div><div style="text-align:right"><div class="v2">'+best+'</div><div class="l">Kỷ Lục</div></div></div>';
}
function hlQuestion(sd){
  const s=HLS[sd.st],L=s.f(sd.l);
  if(sd.st==='ovr')return 'OVR của <b>'+esc(sd.r.n)+'</b> cao hơn hay thấp hơn <b>'+L+'</b>?';
  if(sd.st==='g')return 'Mùa này <b>'+esc(sd.r.n)+'</b> ghi nhiều hay ít bàn hơn <b>'+esc(sd.l.n)+'</b> (<b>'+L+' bàn</b>)?';
  return 'Mùa này <b>'+esc(sd.r.n)+'</b> kiến tạo nhiều hay ít hơn <b>'+esc(sd.l.n)+'</b> (<b>'+L+'</b>)?';
}

  const ic=g.newBest?'<span class="ic best">'+I('<path d="M12 3l2.7 5.6 6.1.8-4.4 4.2 1.1 6.1L12 17l-5.5 2.7 1.1-6.1L3.2 9.4l6.1-.8z"/>',26)+'</span>':'<span class="ic">'+I('<path d="M6 6l12 12M18 6L6 18"/>',26)+'</span>';
  $('ov').classList.add('pop');$('ov').dataset.lock='1';
  openSheet('<div class="hl-pop" role="alertdialog" aria-labelledby="hlpt">'+ic+'<h2 id="hlpt">'+(g.newBest?'Kỷ Lục Mới!':'Kết Thúc')+'</h2>'+
   '<div class="lbl">Điểm Số</div><div class="big">'+g.score+'</div>'+

}
function hlClosePop(){const o=$('ov');delete o.dataset.lock;o.classList.remove('pop');closeSheet()}
const ARW_UP='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ARW_DN='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
function hlBoard(g){
  const sd=hlSides(g),l=sd.l,r=sd.r,revealed=g.status!=='play',fin=g.status==='over';
  const ask={ovr:'có OVR <em>cao hơn</em>',g:'có ghi <em>nhiều bàn hơn</em>',a:'có <em>kiến tạo nhiều hơn</em>'}[sd.st];
  const tag='<div class="hl-ask"><b>'+esc(r.n)+'</b> '+ask+' <b>'+esc(l.n)+'</b> không?</div>';
  const sel=d=>(g.pick===d&&g.res?' sel '+(g.res.ok?'ok':'bad'):'');
  const mid='<div class="hl-mid">'+
    '<button class="hl-arw up'+sel('up')+'" data-act="hlpick" data-d="up" '+(revealed?'disabled':'')+' aria-label="Cao hơn" title="Cao hơn (phím ↑)">'+ARW_UP+'</button>'+
    '<div class="hl-vs">VS</div>'+
    '<button class="hl-arw down'+sel('down')+'" data-act="hlpick" data-d="down" '+(revealed?'disabled':'')+' aria-label="Thấp hơn" title="Thấp hơn (phím ↓)">'+ARW_DN+'</button></div>';
  const row='<div class="hl-row"><div class="hl-c'+(g.anim?' shift':'')+'">'+fcard(l,'known',sd.st)+'</div>'+mid+'<div class="hl-c'+(g.anim?' enter':'')+'">'+fcard(r,revealed?'reveal':'hidden',sd.st)+'</div></div>';
  g.anim=false;
  return tag+row;
}
function hlBody(g){
  if(S.st==='loading')return '<div class="sk" style="height:96px"></div><div class="sk" style="height:300px"></div>';
  if(S.st==='error')return '<div class="emp"><b>Không tải được danh sách cầu thủ</b>Kiểm tra kết nối rồi thử lại.<br><button class="btn" data-act="retry">Thử lại</button></div>';
  return hlStat(g)+hlBoard(g);
}

  const g=hlGame(false);

  return head+top+'<div class="pn">'+hlBody(g)+'</div>';

function countUp(to,sel,from){
  clearInterval(HLC);
  const el=document.querySelector(sel);if(!el)return;
  let n=from;el.textContent=n;
  if(n>=to){el.textContent=to;return}
  HLC=setInterval(()=>{n++;el.textContent=n;if(n>=to)clearInterval(HLC)},to-from>12?38:90);
}
function hlPick(dir){
  if(S.game!=='higher'||S.st!=='data')return;
  const g=hlGame(false);
  if(g.status!=='play')return;
  const res=hlApply(g,dir);
  hlClear();render();
  if(res.st==='ovr')countUp(res.R,'.fc.rv .fc-ovr',Math.max(40,res.R-16));else countUp(res.R,'.fc.rv .fc-stat .v',0);
  const live=$('live');
  if(g.status==='reveal'){
    HLT=setTimeout(()=>fxMini(g.newBest&&g.score===hlBest()?'Đúng! Kỷ lục mới':'Đúng!'),650);
    HLT2=setTimeout(()=>{hlAdvance(g);render()},2100);
    if(live)live.textContent='Đúng!';
  }else{
    HLT=setTimeout(()=>fxWrong(g.res.R+' / '+g.res.L,false),800);
    HLT2=setTimeout(()=>hlPopup(g),2500);
    if(live)live.textContent='Sai rồi.';
  }
}

function rerenderSug(){const g=S.mode==='daily'?dailyGame():practiceGame(false);$('sugbox').innerHTML=sugHtml(g);const sel=GS.sel!=null?POOL[GS.sel]:null;$('selbox').innerHTML=sel?'<div class="selc"><b>'+esc(sel.n)+'</b><button class="tg" data-act="clearsel" style="cursor:pointer">Bỏ chọn</button></div>':'';const b=document.querySelector('.confirm');if(b){b.disabled=!sel}}
function resetGS(){GS={q:'',sel:null,hi:0,err:'',sug:false}}
function curGame(){return S.mode==='daily'?dailyGame():practiceGame(false)}

window.addEventListener('hashchange',()=>{hlClear();hlClosePop();hlRestore();$('fx').innerHTML='';resetGS();S.gtab='play';render();window.scrollTo(0,0)});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(e.target===$('ov')){if(!$('ov').dataset.lock)closeSheet();return}
  if(a){
    const act=a.dataset.act;
    if(act==='pick'){modeSheet(a.dataset.game);return}
    if(act==='close'){closeSheet();return}
    if(act==='rules'){rulesSheet(S.game);return}
    if(act==='login'){toast('Mở màn hình đăng nhập (email hoặc Google)');return}
    if(act==='mode'){closeSheet();const m=a.dataset.m,gm=a.dataset.game||'guess';if(m==='daily'&&!S.auth){location.hash='minigame/'+gm+'/daily';return}if(m==='practice')practiceGame(true);location.hash='minigame/'+gm+'/'+m;return}
    if(act==='hlpick'){hlPick(a.dataset.d);return}
    if(act==='higher'){hlGame(true);location.hash='minigame/higher';return}
    if(act==='hlagain'){hlClosePop();hlClear();hlGame(true);render();return}
    if(act==='hlhome'){hlClosePop();location.hash='minigame';return}
    if(act==='gtab'){S.gtab=a.dataset.t;render();return}
    if(act==='rank'){S.gtab='rank';render();window.scrollTo(0,0);return}
    if(act==='practice'){practiceGame(true);location.hash='minigame/guess/practice';return}
    if(act==='again'){practiceGame(true);resetGS();render();return}
    if(act==='retry'){S.st='loading';$('stt').value='loading';render();setTimeout(()=>{S.st='data';$('stt').value='data';render()},700);return}
    const g=S.game==='guess'?curGame():null;
    if(act==='hint'&&g){if(openHint(g)){GS.err='';render();toast('Đã mở gợi ý: '+HINTS[g.opened+1].l+' (−10 điểm)')}return}
    if(act==='sel'){GS.sel=+a.dataset.id;GS.q=POOL[GS.sel].n;GS.sug=false;GS.err='';render();return}
    if(act==='clearsel'){GS.sel=null;GS.q='';GS.err='';render();return}
    if(act==='guess'&&g){
      const r=doGuess(g,GS.sel);
      if(r.err){GS.err=r.err;render();return}
      resetGS();render();
      if(r.wrong)fxWrong(g.status==='lost'?'Bạn đã dùng hết 3 lượt đoán. Đáp án đã được hiện.':'−20 điểm'+(r.auto?' · đã mở gợi ý: '+r.auto:''),g.status==='lost');
      else fxWin(g.final);
      return;
    }
  }
  const go=e.target.closest('[data-go]');if(go){e.preventDefault();toast('Chuyển tới: '+go.dataset.go);return}
  const l=e.target.closest('a[href="#"]');if(l)e.preventDefault();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('ov').dataset.lock)closeSheet();return}
  if(S.game==='higher'&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&!$('ov').classList.contains('open')){e.preventDefault();hlPick(e.key==='ArrowUp'?'up':'down');return}
  if(e.target.id==='q'){
    const q=norm(GS.q.trim());const a=q?POOL.filter(p=>norm(p.n).includes(q)).slice(0,6):[];
    if(e.key==='ArrowDown'&&a.length){e.preventDefault();GS.hi=(GS.hi+1)%a.length;rerenderSug()}
    if(e.key==='ArrowUp'&&a.length){e.preventDefault();GS.hi=(GS.hi-1+a.length)%a.length;rerenderSug()}
    if(e.key==='Enter'&&a.length&&GS.sel==null){e.preventDefault();GS.sel=a[GS.hi].id;GS.q=a[GS.hi].n;GS.sug=false;render();const i=$('q');if(i)i.focus()}
  }
});
$('auth').onchange=e=>{S.auth=e.target.value==='in';render()};
$('dly').onchange=e=>{S.dly=e.target.value;G.daily=null;resetGS();render()};
$('stt').onchange=e=>{S.st=e.target.value;render()};
$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
render();
</script>
</body>
</html>
